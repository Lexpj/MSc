# File containing the default hyperparameters of PPO from framework Stable Baselines 3
# The hyperparameters as listed below can be found here: 
# https://stable-baselines3.readthedocs.io/en/master/modules/ppo.html#stable_baselines3.ppo.PPO

train:
  learning_rate: 0.03
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  clip_range_vf: null
  normalize_advantage: true
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  use_sde: false
  sde_sample_freq: -1
  rollout_buffer_class: null
  rollout_buffer_kwargs: null
  target_kl: null
  stats_window_size: 100
  
  anneal_lr: true
  num_envs: 1
  
model:
  policy: "MlpPolicy" # Denote that this should be CnnPolicy if applied on Atari.
  policy_kwargs:  
    net_arch: [64,64]
    activation: Tanh
    ortho_init: true
  
logging:
  tensorboard_log: null # Denote that this is configurable via the --log tag.
  log_interval: 1
  
  
